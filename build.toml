[project]
name="kalawindow"
version="1-7-0"
kmake="project.kmake"

[references]
dir_kh="../kalaheaders"
fork_spv="../../_forks/spirv-reflect"
ext_kh="external/kalaheaders"
ext_vk="external/vulkan"
ext_spv="external/spirv-reflect"

[windows-sync]
kh_license=[ "${dir_kh}/LICENSE.md", "${ext_kh}/LICENSE.md", "copy" ]
kh_readme=[ "${dir_kh}/README.md", "${ext_kh}/README.md", "copy" ]
kh_include=[ "${dir_kh}/include", "${ext_kh}/include", "copy" ]
vk_win_stuff=[ "${fork_spv}/_vk", "${ext_vk}", "copy" ]
vk_spv_stuff=[ "${fork_spv}/_build", "${ext_spv}", "copy" ]

[windows-post-build-sync]
kw_bin_rel=[ "build/temp/release-windows/kalawindow.lib", "build/${version}/kalawindow.lib", "copy" ]
kw_bin_deb=[ "build/temp/debug-windows/kalawindowd.lib", "build/${version}/kalawindowd.lib", "copy" ]
kw_include=[ "include", "build/${version}/include", "copy" ]
kw_license=[ "LICENSE.md", "build/${version}/LICENSE.md", "copy" ]
kw_readme=[ "README.md", "build/${version}/README.md", "copy" ]
kh_stuff=[ "${ext_kh}", "build/${version}/kalaheaders", "copy" ]
vk_win_stuff=[ "${ext_vk}", "build/${version}/vulkan", "copy" ]
vk_spv_stuff=[ "${ext_spv}", "build/${version}/spirv-reflect", "copy" ]

[windows-gnu-sync]
kh_license=[ "${dir_kh}/LICENSE.md", "${ext_kh}/LICENSE.md", "copy" ]
kh_readme=[ "${dir_kh}/README.md", "${ext_kh}/README.md", "copy" ]
kh_include=[ "${dir_kh}/include", "${ext_kh}/include", "copy" ]
vk_win_stuff=[ "${fork_spv}/_vk", "${ext_vk}", "copy" ]
vk_spv_stuff=[ "${fork_spv}/_build", "${ext_spv}", "copy" ]

[windows-gnu-post-build-sync]
kw_bin_rel=[ "build/temp/release-windows-gnu/kalawindow-gnu.lib", "build/${version}/kalawindow-gnu.lib", "copy" ]
kw_bin_deb=[ "build/temp/debug-windows-gnu/kalawindow-gnud.lib", "build/${version}/kalawindow-gnud.lib", "copy" ]
kw_include=[ "include", "build/${version}/include", "copy" ]
kw_license=[ "LICENSE.md", "build/${version}/LICENSE.md", "copy" ]
kw_readme=[ "README.md", "build/${version}/README.md", "copy" ]
kh_stuff=[ "${ext_kh}", "build/${version}/kalaheaders", "copy" ]
vk_win_stuff=[ "${ext_vk}", "build/${version}/vulkan", "copy" ]
vk_spv_stuff=[ "${ext_spv}", "build/${version}/spirv-reflect", "copy" ]

[linux-sync]
kh_license=[ "${dir_kh}/LICENSE.md", "${ext_kh}/LICENSE.md", "copy" ]
kh_readme=[ "${dir_kh}/README.md", "${ext_kh}/README.md", "copy" ]
kh_include=[ "${dir_kh}/include", "${ext_kh}/include", "copy" ]
vk_win_stuff=[ "${fork_spv}/_vk", "${ext_vk}", "copy" ]
vk_spv_stuff=[ "${fork_spv}/_build", "${ext_spv}", "copy" ]

[linux-post-build-sync]
kw_bin_rel=[ "build/temp/release-linux/libkalawindow.a", "build/${version}/libkalawindow.a", "copy" ]
kw_bin_deb=[ "build/temp/debug-linux/libkalawindowd.a", "build/${version}/libkalawindowd.a", "copy" ]
kw_include=[ "include", "build/${version}/include", "copy" ]
kw_license=[ "LICENSE.md", "build/${version}/LICENSE.md", "copy" ]
kw_readme=[ "README.md", "build/${version}/README.md", "copy" ]
kh_stuff=[ "${ext_kh}", "build/${version}/kalaheaders", "copy" ]
vk_win_stuff=[ "${ext_vk}", "build/${version}/vulkan", "copy" ]
vk_spv_stuff=[ "${ext_spv}", "build/${version}/spirv-reflect", "copy" ]
